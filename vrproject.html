<!--
Name: Hanna Thomas

Description:
The scene includes a brown cylinder, green cone, blue box, and light green plane.
The cylinder is on the left side of the scene. The cone is placed on top of the cylinder. 
The box is on the right side of the scene. The plane represents the ground under the objects.
Text displaying my name is placed in front of the camera above the objects.
-->

<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <!-- Tree trunk (cylinder) -->
      <a-cylinder position="-1 0.75 -3" radius="0.2" height="1.5" color="brown"></a-cylinder>

      <!-- Tree top (cone) -->
      <a-cone position="-1 2 -3" radius-bottom="0.8" height="1.5" color="green"></a-cone>

      <!-- Box -->
      <a-box position="1 0.5 -3" depth="1" height="1" width="1" color="blue"></a-box>
      
      <!-- Ground -->
      <a-plane position="0 0 -4" rotation="-90 0 0" width="4" height="4" color="#3eea5b"></a-plane>

      <!-- Sky -->
      <a-sky color="#94e4ff"></a-sky>

      <!-- Name Text -->
      <a-text value="Hanna Thomas" position="0 2.5 -3" align="center" color="black"></a-text>
    </a-scene>
  </body>
</html>
