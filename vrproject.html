Name: Hanna Thomas

Description:
This scene provides a meditative experience for the user.
-->

<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>

      <!-- Sky Background -->
      <a-sky color="#88ccee"></a-sky>

      <!-- Light -->
      <a-light type="ambient" intensity="0.7"></a-light>
      <a-light type="point" position="2 4 4"></a-light>

      <!-- Ground -->
      <a-plane rotation="-90 0 0" width="20" height="20" color="#7BC8A4"></a-plane>

      <!-- Breathing Sphere -->
      <a-sphere id="breath"
        position="0 1.5 -3"
        radius="0.5"
        color="blue">
      </a-sphere>

      <!-- UI Text -->
      <a-text id="status"
        value="Click Start to Breathe"
        position="-1 3 -3"
        color="black">
      </a-text>

      <!-- Start Button -->
      <a-box position="-1 1 -2" color="green"
        onclick="startBreathing()"></a-box>
      <a-text value="Start" position="-1.2 1.5 -2" color="black"></a-text>

      <!-- Change Color Button -->
      <a-box position="1 1 -2" color="orange"
        onclick="changeColor()"></a-box>
      <a-text value="Color" position="0.8 1.5 -2" color="black"></a-text>

    </a-scene>

    <script>
      let breathing = false;

      function startBreathing() {
        const sphere = document.querySelector("#breath");
        const text = document.querySelector("#status");

        if (!breathing) {
          sphere.setAttribute("animation", {
            property: "scale",
            dir: "alternate",
            dur: 2000,
            loop: true,
            to: "1.5 1.5 1.5"
          });
          text.setAttribute("value", "Breathe In... Out...");
          breathing = true;
        }
      }

      function changeColor() {
        const sphere = document.querySelector("#breath");
        const colors = ["blue", "purple", "pink", "cyan"];
        const random = colors[Math.floor(Math.random() * colors.length)];
        sphere.setAttribute("color", random);
      }
    </script>
  </body>
</html>
