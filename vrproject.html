<!--
Name: Hanna Thomas

Description:
This scene provides a meditative experience for the user. 
It represents a nature-themed environment using basic objects.
-->

<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>

      <!-- Camera with Cursor -->
      <a-camera position="0 2 8">
        <a-cursor></a-cursor>
      </a-camera>

      <!-- Sky Background -->
      <a-sky id="sky" color="#1c86ba"></a-sky>

      <!-- Ground -->
      <a-plane rotation="-90 0 0" width="50" height="50" color="#117e4b"></a-plane>

      <!-- Light -->
      <a-light type="ambient" intensity="0.7"></a-light>
      <a-light type="point" position="2 4 4"></a-light>

      <!-- Pond -->
      <a-circle position="-12 0.1 12" radius="12.5" rotation="-90 0 0" color="#151599"></a-circle>

      <!-- Tree 1 (back-left) -->
      <a-cylinder position="-12.5 2 -15" radius="0.5" height="5" color="#521d00"></a-cylinder>
      <a-cone position="-12.5 5 -15" radius-bottom="2.8" height="5" color="#015101"></a-cone>
      <!-- Tree 2 (back-center) -->
      <a-cylinder position="-0.5 2 -15" radius="0.5" height="5" color="#521d00"></a-cylinder>
      <a-cone position="-0.5 5 -15" radius-bottom="2.8" height="5" color="#133513"></a-cone>
      <!-- Tree 3 (back-right) -->
      <a-cylinder position="12.5 2 -15" radius="0.5" height="5" color="#521d00"></a-cylinder>
      <a-cone position="12.5 5 -15" radius-bottom="2.8" height="5" color="#235323"></a-cone>
      <!-- Tree 4 (front-right) -->
      <a-cylinder position="12.5 2 15" radius="0.5" height="5" color="#521d00"></a-cylinder>
      <a-cone position="12.5 5 15" radius-bottom="2.8" height="5" color="#055c05"></a-cone>
      <!-- Tree 5 (center-right) -->
      <a-cylinder position="19.5 2 4" radius="0.5" height="5" color="#521d00"></a-cylinder>
      <a-cone position="19.5 5 4" radius-bottom="2.8" height="5" color="#133513"></a-cone>

      <!-- Cloud 1 (center) -->
      <a-sphere position="0 9 -3" radius="1" color="white"></a-sphere>
      <a-sphere position="1.5 9 -3" radius="1" color="white"></a-sphere>
      <a-sphere position="0.75 9.75 -3" radius="1" color="white"></a-sphere>
      <!-- Cloud 2 (front-right) -->
      <a-sphere position="10 9 12" radius="1" color="white"></a-sphere>
      <a-sphere position="11.5 9 12" radius="1" color="white"></a-sphere>
      <a-sphere position="10.75 9.75 12" radius="1" color="white"></a-sphere>
      <!-- Cloud 3 (back-left) -->
      <a-sphere position="-10 9 -10" radius="1" color="#949494"></a-sphere>
      <a-sphere position="-11.5 9 -10" radius="1" color="#949494"></a-sphere>
      <a-sphere position="-10.75 9.75 -10" radius="1" color="#949494"></a-sphere>
      <!-- Cloud 4 (back-right) -->
      <a-sphere position="10 9 -10" radius="1" color="#8c8c8c"></a-sphere>
      <a-sphere position="11.5 9 -10" radius="1" color="#8c8c8c"></a-sphere>
      <a-sphere position="10.75 9.75 -10" radius="1" color="#8c8c8c"></a-sphere>

      <!-- Title -->
      <a-text value="Meditation Space" position="-1.3 18 0.1" color="yellow" width="40"></a-text>

      <!-- Change Sky Button -->
      <a-plane id="skyButton" position="-20 3 -20" width="2.5" height="0.7" color="yellow">
        <a-text value="Change Sky" align="center" position="0 0 0.1" color="black"></a-text>
      </a-plane>

    </a-scene>

    <script>
      const sky = document.querySelector('#sky');
      const button = document.querySelector('#skyButton');
  
      let currentSky = 0;
  
      button.addEventListener('click', function () {
          if (currentSky === 0) {
              sky.setAttribute('color', '#0b1d51'); // night
              currentSky = 1;
          }
          else {
              sky.setAttribute('color', '#1c86ba'); // daytime
              currentSky = 0;
          }
      });
  </script>

  </body>
</html>
